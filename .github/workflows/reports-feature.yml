name: Grisbi reports feature

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'src/**'
      - 'templates/**'
      - 'webpack.js'
      - 'appinfo/**'
      - 'tests/compatibility/test_reports.py'
      - 'tests/compatibility/test_phase_a_backend.py'
      - 'tests/compatibility/test_edit_missing_references.py'
      - 'tests/frontend/test_edit_missing_references.mjs'
      - 'tests/php/**'
      - '.github/workflows/reports-feature.yml'
  workflow_dispatch:

jobs:
  reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pycryptodomex
      - name: Compile Python backend
        run: python -m compileall -q lib/bin/ncgrisbi
      - name: Run read-model, report and existing-transaction edit contracts
        run: python -m pytest -q tests/compatibility/test_phase_a_backend.py tests/compatibility/test_reports.py tests/compatibility/test_edit_missing_references.py
      - name: Lint PHP files
        run: find lib appinfo tests/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run shared-lock PHP service contract
        run: php tests/php/test_phase3_document_service.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Test editing with missing references
        run: node tests/frontend/test_edit_missing_references.mjs
      - name: Test Files action recognition
        run: node tests/frontend/test_files_action.mjs
      - name: Test Files integration source contract
        run: php tests/php/test_files_integration_source_contract.php
      - name: Lint frontend
        run: npm run lint
      - name: Build app
        run: npm run build
      - name: Build Files action bundle
        run: |
          npm run buildviewer
          test -s dist/js/viewer.js
          test -s dist/js/app.js
